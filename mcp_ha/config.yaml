name: MCP Home Assistant
version: "0.1.3"
slug: mcp_ha
description: >-
  MCP (Model Context Protocol) server to query and control Home Assistant
  from an AI assistant (Claude, Gemini...)
url: https://github.com/Devitek/mcp-ha
arch:
  - aarch64
  - amd64
init: false
startup: services
image: ghcr.io/devitek/mcp-ha-{arch}
homeassistant_api: true
# Manager role to read add-on information through the Supervisor API.
# See issue #11: downgrade if "default" turns out to be enough for reads.
hassio_api: true
hassio_role: manager
ports:
  "9583/tcp": 9583
ports_description:
  "9583/tcp": MCP endpoint (Streamable HTTP) and /health
options:
  log_level: info
  api_token: ""
  allow_write: false
  filter_reads: false
  entity_allowlist: []
  entity_denylist: []
  service_denylist:
    - homeassistant.stop
    - homeassistant.restart
    - hassio.*
    - shell_command.*
    - python_script.*
    - recorder.purge*
    - backup.*
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  api_token: password?
  allow_write: bool
  filter_reads: bool
  entity_allowlist:
    - str
  entity_denylist:
    - str
  service_denylist:
    - str
