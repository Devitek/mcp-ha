name: MCP Home Assistant
version: "0.1.6"
slug: mcp_ha
description: >-
  MCP (Model Context Protocol) server to query and control Home Assistant
  from an AI assistant (Claude, Gemini...)
url: https://github.com/Devitek/mcp-ha
arch:
  - aarch64
  - amd64
init: false
# application: started after Home Assistant Core, which this add-on talks to
# from the first second (audit A4).
startup: application
image: ghcr.io/devitek/mcp-ha-{arch}
homeassistant_api: true
# Least privilege (audit A1): the self endpoints used for the token
# write-back accept any role, and ha_get_addons degrades with a clear
# message if "default" turns out to be insufficient for listing.
hassio_api: true
hassio_role: default
ports:
  "9583/tcp": 9583
ports_description:
  "9583/tcp": MCP endpoint (Streamable HTTP) and /health
options:
  log_level: info
  api_token: ""
  allow_write: false
  filter_reads: false
  entity_allowlist: []
  entity_denylist: []
  service_denylist:
    - homeassistant.stop
    - homeassistant.restart
    - hassio.*
    - shell_command.*
    - python_script.*
    - recorder.purge*
    - backup.*
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  api_token: password?
  allow_write: bool
  filter_reads: bool
  entity_allowlist:
    - str
  entity_denylist:
    - str
  service_denylist:
    - str
