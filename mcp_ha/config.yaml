name: MCP Home Assistant
version: "0.19.0"
slug: mcp_ha
description: >-
  MCP (Model Context Protocol) server to query and control Home Assistant
  from an AI assistant (Claude, Gemini...)
url: https://github.com/Devitek/mcp-ha
arch:
  - aarch64
  - amd64
# startup is left at its default (application, started after HA Core, audit
# A4) and hassio_role at its default too (least privilege, audit A1): the
# add-on linter refuses keys that repeat default values.
init: false
image: ghcr.io/devitek/mcp-ha-{arch}
homeassistant_api: true
hassio_api: true
# Status page through HA ingress (v0.3): the port stays internal to the
# container network, the Supervisor authenticates HA users to it.
ingress: true
ingress_port: 9584
panel_icon: mdi:robot-happy
ports:
  "9583/tcp": 9583
ports_description:
  "9583/tcp": MCP endpoint (Streamable HTTP) and /health
options:
  log_level: info
  api_token: ""
  api_tokens: []
  allow_write: false
  allow_camera: false
  allow_config_write: false
  enable_sessions: false
  filter_reads: false
  entity_allowlist: []
  entity_denylist: []
  service_denylist:
    - homeassistant.stop
    - homeassistant.restart
    - hassio.*
    - shell_command.*
    - python_script.*
    - recorder.purge*
    - backup.*
  confirm_domains:
    - lock
    - alarm_control_panel
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  api_token: password?
  api_tokens:
    - name: str
      token: password
      scope: list(read|write)
  allow_write: bool
  allow_camera: bool
  allow_config_write: bool
  enable_sessions: bool
  filter_reads: bool
  entity_allowlist:
    - str
  entity_denylist:
    - str
  service_denylist:
    - str
  confirm_domains:
    - str
