configuration:
  log_level:
    name: Log level
    description: >-
      Verbosity of the add-on log. info is a good default, debug and trace
      help when diagnosing an issue. Write audit lines are always emitted
      regardless of this level.
  api_token:
    name: API token
    description: >-
      Primary token (full access) expected in the Authorization header of MCP
      clients. Leave empty to generate one on first start: it is then saved
      back into this option. The log only ever shows a masked prefix of it.
  api_tokens:
    name: Named tokens
    description: >-
      Extra tokens with a name and a scope (read or write), on top of the
      primary token. Give a read-only token to an experimental client, a
      write token to your main assistant. The token name appears in the
      write audit log.
  allow_write:
    name: Allow write
    description: >-
      Exposes the ha_call_service tool so the assistant can call Home
      Assistant services. When disabled the add-on is read only.
  allow_camera:
    name: Allow camera snapshots
    description: >-
      Exposes the ha_get_camera_snapshot tool so the assistant can see a
      still image from a camera. Independent from allow_write. Denied
      cameras (filter_reads / entity_denylist) still apply.
  allow_config_write:
    name: Allow automation and script creation
    description: >-
      Exposes ha_create_automation and ha_create_script: the assistant can
      program NEW behaviour into your home. Independent from allow_write.
      Every creation is validated by Home Assistant first and requires a
      two-step confirmation showing the full YAML. Existing automations and
      scripts are never modified.
  filter_reads:
    name: Filter reads too
    description: >-
      Applies the entity denylist to reads as well. Denied entities disappear
      from listings, entity details, history, statistics and the logbook.
  entity_allowlist:
    name: Entity allowlist (writes)
    description: >-
      Glob patterns (e.g. light.*). When not empty, only these entities can
      be targeted by a write.
  entity_denylist:
    name: Entity denylist (writes)
    description: >-
      Glob patterns (e.g. lock.*). These entities can never be targeted by a
      write, the denylist always wins.
  service_denylist:
    name: Service denylist
    description: >-
      Services that are always refused (e.g. hassio.*, shell_command.*).
      Think twice before removing entries.
  confirm_domains:
    name: Domains requiring confirmation
    description: >-
      Writes on these domains need a two-step confirmation: the assistant
      first receives a preview and a single-use token, and must call again
      with it to execute. Defaults protect locks and alarms.
network:
  9583/tcp: MCP server port (and /health endpoint)
