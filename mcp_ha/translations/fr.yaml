configuration:
  log_level:
    name: Niveau de log
    description: >-
      Verbosité du journal de l'add-on. info est un bon défaut, debug et
      trace aident au diagnostic. Les lignes d'audit des écritures sont
      toujours émises quel que soit ce niveau.
  api_token:
    name: Jeton API
    description: >-
      Jeton principal (accès complet) attendu dans l'en-tête Authorization
      des clients MCP. Laissez vide pour en générer un au premier démarrage :
      il est alors reporté dans cette option. Le journal n'affiche jamais
      qu'un préfixe masqué.
  api_tokens:
    name: Jetons nommés
    description: >-
      Jetons supplémentaires avec un nom et une portée (read ou write), en
      plus du jeton principal. Donnez un jeton en lecture seule à un client
      expérimental, un jeton d'écriture à votre assistant principal. Le nom
      du jeton apparaît dans le journal d'audit des écritures.
  allow_write:
    name: Autoriser l'écriture
    description: >-
      Expose l'outil ha_call_service qui permet à l'assistant d'appeler des
      services Home Assistant. Désactivé, l'add-on est en lecture seule.
  allow_camera:
    name: Autoriser les captures caméra
    description: >-
      Expose l'outil ha_get_camera_snapshot pour que l'assistant voie une
      image fixe d'une caméra. Indépendant de allow_write. Les caméras
      masquées (filter_reads / entity_denylist) restent exclues.
  allow_config_write:
    name: Autoriser la création d'automations et de scripts
    description: >-
      Expose ha_create_automation et ha_create_script : l'assistant peut
      programmer un NOUVEAU comportement dans votre maison. Indépendant
      d'allow_write. Chaque création est d'abord validée par Home Assistant
      et exige une confirmation en deux temps montrant le YAML complet. Les
      automations et scripts existants ne sont jamais modifiés.
  filter_reads:
    name: Filtrer aussi les lectures
    description: >-
      Applique la liste noire d'entités aux lectures. Les entités masquées
      disparaissent des listes, du détail, de l'historique, des statistiques
      et du logbook.
  entity_allowlist:
    name: Liste blanche d'entités (écriture)
    description: >-
      Motifs glob (ex. light.*). Si la liste n'est pas vide, seules ces
      entités peuvent être ciblées par une écriture.
  entity_denylist:
    name: Liste noire d'entités (écriture)
    description: >-
      Motifs glob (ex. lock.*). Ces entités ne peuvent jamais être ciblées
      par une écriture, la liste noire gagne sur la liste blanche.
  service_denylist:
    name: Liste noire de services
    description: >-
      Services interdits quel que soit le contexte (ex. hassio.*,
      shell_command.*). Réfléchissez avant d'en retirer.
  confirm_domains:
    name: Domaines à confirmation
    description: >-
      Les écritures sur ces domaines exigent une confirmation en deux
      temps : l'assistant reçoit d'abord un aperçu et un jeton à usage
      unique, et doit rappeler avec pour exécuter. Les défauts protègent
      serrures et alarmes.
network:
  9583/tcp: Port du serveur MCP (et endpoint /health)
