name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-addon:
    name: Lint du manifest add-on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint de la configuration de l'add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: "./mcp_ha"

  build-test:
    name: Build, tests et audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_ha
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp_ha/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Typecheck (tests inclus)
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

  build-image:
    name: Build de validation de l'image Docker (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build de l'image (sans push)
        run: |
          BUILD_FROM=$(grep 'amd64:' mcp_ha/build.yaml | awk '{print $2}')
          docker build --build-arg BUILD_FROM="$BUILD_FROM" mcp_ha/
