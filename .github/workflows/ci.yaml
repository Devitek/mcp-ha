name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton au plus juste (audit D9) : rien dans cette CI n'écrit.
permissions:
  contents: read

# Les pushes rapprochés annulent les runs devenus obsolètes (audit E12).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-addon:
    name: Lint du manifest add-on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint de la configuration de l'add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: "./mcp_ha"

  build-test:
    name: Build, tests et audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_ha
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp_ha/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Typecheck (tests inclus)
        run: npm run typecheck

      - name: Tests unitaires (avec couverture, audit E9)
        run: npm test -- --coverage

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

  build-image:
    name: Build de validation de l'image Docker (amd64) + scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build de l'image (sans push)
        run: |
          BUILD_FROM=$(grep 'amd64:' mcp_ha/build.yaml | awk '{print $2}')
          docker build --build-arg BUILD_FROM="$BUILD_FROM" -t mcpha-scan mcp_ha/

      - name: Scan de vulnérabilités de l'image (audit E10/D10)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcpha-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # La cross-compilation aarch64 n'était validée qu'au tag (audit E8) : elle
  # tourne désormais à chaque push main. Pas sur les PRs, QEMU est trop lent.
  build-image-aarch64:
    name: Build de validation de l'image Docker (aarch64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build de l'image (sans push)
        run: |
          BUILD_FROM=$(grep 'aarch64:' mcp_ha/build.yaml | awk '{print $2}')
          docker build --platform linux/arm64 --build-arg BUILD_FROM="$BUILD_FROM" mcp_ha/
