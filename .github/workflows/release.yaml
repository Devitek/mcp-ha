name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Permissions par job (audit D6) : verify n'écrit rien, build ne pousse que
# des images, seule la création de release touche au contenu.
permissions: {}

jobs:
  verify:
    name: Cohérence des versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Le tag doit correspondre à config.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version: \"${tag}\"$" mcp_ha/config.yaml; then
            echo "::error::Le tag v${tag} ne correspond pas à la version de mcp_ha/config.yaml"
            exit 1
          fi
          if ! grep -q "\"version\": \"${tag}\"" mcp_ha/package.json; then
            echo "::error::Le tag v${tag} ne correspond pas à la version de mcp_ha/package.json"
            exit 1
          fi
          if ! grep -q "VERSION = \"${tag}\"" mcp_ha/src/config.ts; then
            echo "::error::Le tag v${tag} ne correspond pas à VERSION dans mcp_ha/src/config.ts (source de /health et des logs)"
            exit 1
          fi

  build:
    name: Build des images (${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: QEMU pour la compilation croisée
        uses: docker/setup-qemu-action@v4

      - name: Login sur ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        # Épinglé par tag de release (audit D2) : master est mutable et ce job
        # détient packages: write. Le pin par SHA est impossible avec cette
        # action, elle utilise sa ref git comme tag de sa propre image Docker
        # (amd64-builder:<ref>). 2026.03.2 est le DERNIER tag dont l'image est
        # publiée sur ghcr (le projet déprécié n'en publie plus depuis) : ne
        # pas monter ce pin sans vérifier l'existence de l'image. Migration
        # complète hors builder suivie dans #25, devenue urgente.
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/mcp_ha \
            --image mcp-ha-{arch} \
            --docker-hub ghcr.io/devitek

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Création de la release avec notes générées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
