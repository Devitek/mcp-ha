name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Répétition à blanc (audit, migration #25) : mêmes étapes de build sans
  # push ni release, pour valider le pipeline sans publier.
  workflow_dispatch:

# Permissions par job (audit D6) : verify n'écrit rien, build ne pousse que
# des images, seule la création de release touche au contenu.
permissions: {}

jobs:
  verify:
    name: Cohérence des versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Le tag doit correspondre à config.yaml
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version: \"${tag}\"$" mcp_ha/config.yaml; then
            echo "::error::Le tag v${tag} ne correspond pas à la version de mcp_ha/config.yaml"
            exit 1
          fi
          if ! grep -q "\"version\": \"${tag}\"" mcp_ha/package.json; then
            echo "::error::Le tag v${tag} ne correspond pas à la version de mcp_ha/package.json"
            exit 1
          fi
          if ! grep -q "VERSION = \"${tag}\"" mcp_ha/src/config.ts; then
            echo "::error::Le tag v${tag} ne correspond pas à VERSION dans mcp_ha/src/config.ts (source de /health et des logs)"
            exit 1
          fi

  # Migration hors home-assistant/builder (#25) : l'action est dépréciée et
  # ne publie plus ses propres images depuis 2026.03.2. Build direct par
  # docker/build-push-action, avec les labels io.hass.* que le builder
  # posait. provenance: false pour garder des manifestes simples que le
  # Supervisor sait tirer.
  build:
    name: Build des images (${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: QEMU pour la compilation croisée
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login sur ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Variables de build
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dry" >> "$GITHUB_OUTPUT"
          fi
          echo "build_from=$(grep '${{ matrix.arch }}:' mcp_ha/build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: mcp_ha
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: |
            BUILD_FROM=${{ steps.vars.outputs.build_from }}
          tags: |
            ghcr.io/devitek/mcp-ha-${{ matrix.arch }}:${{ steps.vars.outputs.version }}
            ghcr.io/devitek/mcp-ha-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=MCP Home Assistant
            io.hass.description=MCP (Model Context Protocol) server for Home Assistant
            io.hass.type=addon
            io.hass.version=${{ steps.vars.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.title=MCP Home Assistant
            org.opencontainers.image.source=https://github.com/Devitek/mcp-ha
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Création de la release avec notes générées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
